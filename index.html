<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Espacio para tu código</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 2rem auto;
        max-width: 900px;
        padding: 0 1rem;
      }

      textarea {
        width: 100%;
        min-height: 70vh;
        font-family: "Courier New", Courier, monospace;
        font-size: 14px;
        line-height: 1.5;
        padding: 1rem;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <h1>Un sitio donde puedas poner tu código</h1>
    <textarea placeholder="Pega o escribe aquí tu código..."></textarea>
  </body>
</html>
